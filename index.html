<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tour-trip</title>
    <script>
      (function() {
        try {
          // Mirrors scopeForPath in ThemeProvider: admin defaults to dark, storefront to light.
          var admin = /^\/(admin|login)(\/|$)/.test(location.pathname);
          var saved = localStorage.getItem(admin ? 'tourtrip.theme' : 'tourtrip.theme.storefront');
          var theme = saved === 'light' || saved === 'dark' ? saved : (admin ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
